server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zelia.io;

    ssl_certificate /etc/letsencrypt/live/zelia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zelia.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zelia.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zelia.io;

    root /root/apps/zelia/client/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/zelia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zelia.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location /static/ {
        alias /root/apps/zelia/client/dist/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /root/apps/zelia/client/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5051/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Dynamic formation sitemaps must be served at the site root because a
    # sitemap can only reference URLs at or below its own path.
    location ~ ^/(sitemap-index\.xml|sitemap-formations-\d+\.xml)$ {
        proxy_pass http://127.0.0.1:5051/api/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy duplicate aliases permanently consolidated onto /orientation.
    location ~ ^/(?:questionnaire|avatar)/?$ {
        return 301 https://zelia.io/orientation;
    }

    # Blog index and articles are canonicalized without a trailing slash; serve
    # the pre-rendered HTML directly instead of issuing a directory 301 to `/`.
    location = /blog {
        try_files /blog/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /blog/ {
        return 301 https://zelia.io/blog;
    }

    location ~ ^/blog/([a-z0-9-]+)/$ {
        return 301 https://zelia.io/blog/$1;
    }

    location ~ ^/blog/([a-z0-9-]+)$ {
        try_files /blog/$1/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Formations directory (no trailing slash) and SSR formation detail pages.
    location = /formations {
        try_files /formations/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /formations/ {
        return 301 https://zelia.io/formations;
    }

    location ~ ^/formations/([^/]+)/$ {
        return 301 https://zelia.io/formations/$1;
    }

    location ~ ^/formations/[^/]+$ {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metiers {
        return 301 https://zelia.io/metiers/;
    }

    # Editorial pages and their JSON must never fall back to the SPA.
    location ^~ /metiers/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /metiers-data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/sitemap-metiers-(index|\d+)\.xml$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        try_files /home.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(orientation|parents|login|register|legal/mentions-legales|legal/conditions)/$ {
        return 301 https://zelia.io/$1;
    }

    location ~ ^/(orientation|parents|login|register|legal/mentions-legales|legal/conditions)$ {
        try_files /$1/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    # Known authenticated/portal SPA prefixes.
    location ~ ^/(?:app|admin|espace-ecoles|auth)(?:/|$) {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Root-level static files (favicon-adjacent assets, overrides.css, etc.).
    location ~* ^/[^/]+\.(?:css|js|ico|svg|png|jpg|jpeg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Unknown paths return a genuine HTTP 404 instead of SPA Soft-404s.
    location / {
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name zelia.io www.zelia.io;
    return 301 https://zelia.io$request_uri;
}
